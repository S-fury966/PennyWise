# ============================================================================
# Docker Compose — AI Finance Controller (Reconciliation Agent)
# ============================================================================
# Two services:
#   backend  — FastAPI + reconciliation pipeline (Python 3.12)
#   frontend — Vite-built React SPA served by nginx (Node 22 build → nginx)
#
# Usage:
#   1. Copy .env.example to .env and fill in your GROQ_API_KEY.
#   2. docker-compose up --build
#   3. Frontend: http://localhost:8080
#      Backend API: http://localhost:8000
#
# Networking:
#   Docker Compose's default bridge network provides DNS resolution by
#   service name. The frontend's nginx reverse-proxies /api/* to
#   "backend:8000" — no CORS issues, single origin for the browser.
# ============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Published port for direct API access (e.g. Swagger UI at /docs).
      # Also used by the frontend's nginx proxy_pass.
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist output/ and data/custom/ across container restarts so that
      # reconciliation results survive a `docker-compose restart` (but NOT
      # a `docker-compose down -v` which removes volumes). For a hackathon
      # demo this is convenient — you can restart the backend without
      # losing results. For a clean slate, run `docker-compose down -v`.
      - output:/app/output
      - custom-data:/app/data/custom
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Mapped to 8080 on the host to avoid conflicts with common local
      # services (e.g. Vite dev server on 5173, or other apps on 80).
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  output:
  custom-data:
