# nginx configuration for the frontend container.
#
# Serves the Vite-built React SPA and reverse-proxies /api requests
# to the backend service. Docker Compose's internal DNS resolves
# "backend" to the backend container's IP on the shared network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Reverse proxy for the backend API ---
    # Requests to /api/* are forwarded to the backend container on port 8000.
    # "backend" is the service name in docker-compose.yml — Docker Compose's
    # built-in DNS server maps this to the container's IP on the shared
    # network. This means the browser talks to one origin (this nginx),
    # and nginx handles the inter-container routing. No CORS issues.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeout for reconciliation runs. A full run makes up to
        # 60 sequential Groq API calls (one explanation per transaction).
        # On Groq's free tier (30 requests/minute), the batch WILL cross
        # at least one rate-limit window, and the explainer's retry/backoff
        # logic waits out 429s rather than failing fast. Observed worst-case
        # runs can exceed 2 minutes, so 120s was too tight — this caused the
        # 504 Gateway Timeout even though the backend eventually succeeded.
        # 300s (5 min) gives real headroom without hanging forever on a
        # genuinely dead backend.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --- React SPA fallback ---
    # For any path that doesn't match a static file, serve index.html.
    # This ensures client-side routes (e.g. /dashboard, /transactions)
    # don't 404 on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache static assets ---
    # Vite hashes filenames for cache-busting (e.g. /assets/index-a1b2c3.js),
    # so we can safely set long cache durations.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
